<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1-20 тапсырма — жеңіл түсіндірме</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1E27;
    --panel:#242833;
    --panel-2:#2C303C;
    --border:#383D4B;
    --text:#E9EAEE;
    --muted:#9AA1B4;
    --gold:#E8B339;
    --blue:#5B9BD5;
    --green:#6FCF97;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  code, pre, .mono{font-family:'JetBrains Mono',monospace;}

  header{
    padding:26px 18px 16px;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:rgba(27,30,39,0.96);
    backdrop-filter:blur(6px);
    z-index:10;
  }
  header h1{
    margin:0 0 4px;
    font-size:1.35rem;
    font-weight:800;
    letter-spacing:-0.02em;
  }
  header p{
    margin:0 0 14px;
    color:var(--muted);
    font-size:0.86rem;
  }
  .search{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    font-size:0.95rem;
    font-family:'Manrope',sans-serif;
  }
  .search:focus{outline:2px solid var(--blue); outline-offset:1px;}

  main{padding:16px 14px 0;}

  .card{
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:var(--radius);
    margin-bottom:10px;
    overflow:hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    cursor:pointer;
  }
  .num{
    flex:none;
    width:34px;
    height:34px;
    border-radius:9px;
    background:var(--panel-2);
    color:var(--gold);
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:0.85rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card-head .title{
    flex:1;
    font-size:0.93rem;
    font-weight:600;
    line-height:1.35;
  }
  .chev{
    flex:none;
    color:var(--muted);
    font-size:1.1rem;
    transition:transform .18s ease;
  }
  .card.open .chev{transform:rotate(180deg);}

  .card-body{
    display:none;
    padding:0 16px 18px;
    border-top:1px solid var(--border);
  }
  .card.open .card-body{display:block;}

  .section-label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    margin:16px 0 8px;
    font-weight:700;
  }

  pre.code{
    background:#15171E;
    border:1px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    overflow-x:auto;
    font-size:0.82rem;
    line-height:1.6;
    margin:0;
    color:#D8DEE9;
    white-space:pre;
  }
  pre.code .kw{color:#E8B339;}
  pre.code .fn{color:#5B9BD5;}
  pre.code .str{color:#6FCF97;}

  .langtabs{
    display:flex;
    gap:6px;
    margin-top:14px;
  }
  .langtab{
    flex:1;
    text-align:center;
    padding:8px 0;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--muted);
    font-size:0.82rem;
    font-weight:700;
    cursor:pointer;
  }
  .langtab.active{
    background:var(--gold);
    border-color:var(--gold);
    color:#1B1E27;
  }

  .explain{
    font-size:0.9rem;
    line-height:1.65;
    color:var(--text);
    margin-top:10px;
    display:none;
  }
  .explain.show{display:block;}
  .explain b{color:var(--gold);}
  .explain code{
    background:var(--panel-2);
    padding:1px 5px;
    border-radius:5px;
    font-size:0.85em;
  }

  .qa{
    border-left:2px solid var(--blue);
    padding:8px 0 8px 12px;
    margin-bottom:10px;
  }
  .qa .q{
    font-size:0.85rem;
    font-weight:700;
    color:var(--blue);
    margin-bottom:4px;
  }
  .qa .q::before{content:"Мұғалім: ";color:var(--muted);font-weight:600;}
  .qa .a{
    font-size:0.85rem;
    color:var(--text);
    line-height:1.55;
  }
  .qa .a code{
    background:var(--panel-2);
    padding:1px 5px;
    border-radius:5px;
    font-size:0.85em;
  }

  .empty{
    text-align:center;
    color:var(--muted);
    padding:40px 10px;
    font-size:0.9rem;
  }

  @media(min-width:720px){
    main{max-width:760px;margin:0 auto;padding:20px 14px 0;}
    header{padding:32px 0 18px;}
    header > *{max-width:760px;margin-left:auto;margin-right:auto;display:block;}
  }
</style>
</head>
<body>

<header>
  <h1>1-20 тапсырма · жеңіл тіл</h1>
  <p>Қарапайым сөзбен, КЗ + РУ, кез келгенін ашып оқы</p>
  <input class="search" id="search" placeholder="Нөмірін немесе сөзді іздеу...">
</header>

<main id="list"></main>

<script>
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function hl(code){
  code = esc(code);
  code = code.replace(/"([^"]*)"/g, '<span class="str">"$1"</span>');
  code = code.replace(/\b(if|elif|else|for|while|in|range|and|or|not|print|input|int)\b/g, (m)=>{
    if(m==='print'||m==='input'||m==='int'||m==='range') return '<span class="fn">'+m+'</span>';
    return '<span class="kw">'+m+'</span>';
  });
  return code;
}

const tasks = [
{n:1, title:'Оң немесе теріс сан',
code:`a = int(input("Сан енгізіңіз: "))

if a > 0:
    print("Оң сан")
elif a < 0:
    print("Теріс сан")
else:
    print("Нөл")`,
ru:`Короче, тут всё просто. Спрашиваем у юзера число, суём его в <code>int()</code>, потому что <code>input()</code> реально даёт нам просто текст, а не число — прикинь, комп его как буквы видит, пока не переведёшь. Дальше три варианта: либо число больше нуля (плюс), либо меньше (минус), либо ровно ноль. Поэтому три ветки: <code>if</code>, <code>elif</code>, <code>else</code>. Если бы вариантов было два — хватило бы if/else, но тут третий (ноль) отдельно торчит, вот и добавили elif.`,
kz:`Қысқасы, бәрі оңай. Пайдаланушыдан сан сұраймыз, оны <code>int()</code>-пен санға айналдырамыз, себебі <code>input()</code> әрдайым мәтін қайтарады — комп оны әуелі әріп сияқты көреді. Одан кейін үш нұсқа болады: сан нөлден үлкен (оң), кіші (теріс), немесе дәл нөл. Сондықтан үш тармақ жаздық: <code>if</code>, <code>elif</code>, <code>else</code>. Екі нұсқа болса if/else жеткілікті болар еді, бірақ мұнда нөл бөлек тұр, сол үшін elif қостық.`,
qa:[
{q:'Неге тек if/else жеткіліксіз?', a:'Себебі 3 нәтиже бар (оң/теріс/нөл), ал if/else тек 2-ге бөледі.'},
{q:'int() болмаса не болады?', a:'Программа "5" деген жолды санмен салыстыра алмай қате шығарады.'}
]},

{n:2, title:'Жұп немесе тақ сан',
code:`a = int(input("Сан енгізіңіз: "))

if a % 2 == 0:
    print("Жұп сан")
else:
    print("Тақ сан")`,
ru:`Тут фишка в значке <code>%</code> — это не проценты, это "остаток от деления". Берём число, делим на 2 и смотрим, что осталось. Если осталось 0 (то есть поделилось ровно, без хвостика) — число чётное. Если остался хвостик (единичка) — нечётное. Народ часто путает <code>%</code> с обычным <code>/</code> — а это разные вещи: <code>/</code> даёт полный результат деления (типа 5/2=2.5), а <code>%</code> — только то, что не влезло.`,
kz:`Мұнда бас кейіпкер — <code>%</code> белгісі, ол пайыз емес, "бөлу қалдығы" дегенді білдіреді. Санды 2-ге бөліп, не қалды соны қараймыз. Егер ештеңе қалмаса (0) — сан жұп. Егер бір нәрсе қалса (1) — тақ. Көбі <code>%</code> пен <code>/</code>-ты шатастырады, ал бұлар мүлдем басқа нәрсе: <code>/</code> толық нәтиже береді (5/2=2.5), ал <code>%</code> тек сыймай қалған қалдықты береді.`,
qa:[
{q:'% пен / айырмашылығы?', a:'/ — толық бөлу нәтижесі, % — сол бөлудің қалдығы ғана.'},
{q:'Неге / қолданбадың?', a:'/ бөлшек сан береді (2.5), ал бізге тек "қалдық бар ма, жоқ па" керек.'}
]},

{n:3, title:'Кәмелетке толу',
code:`age = int(input("Жасыңызды енгізіңіз: "))

if age >= 18:
    print("Кәмелетке толған")
else:
    print("Кәмелетке толмаған")`,
ru:`Максимально просто: спросили возраст, сравнили с 18. Тут важная деталь — знак <code>>=</code>, а не просто <code>></code>. Почему? Потому что если ровно 18 лет — это уже совершеннолетие, а не "почти". Если бы поставили просто <code>></code>, чувак ровно 18 лет от роду вылетел бы в "не совершеннолетний", и это было бы неправильно.`,
kz:`Максималды оңай: жасты сұрадық, 18-мен салыстырдық. Мұндағы маңызды нәрсе — <code>>=</code> белгісі, жәй <code>></code> емес. Неге? Себебі дәл 18 жаста болу — бұл толық кәмелетке толу деген сөз, "жуық" емес. Егер жәй <code>></code> қойсақ, дәл 18 жастағы адам "толмаған" болып шығып, бұл қате болар еді.`,
qa:[
{q:'Неге >= қолдандың, > емес?', a:'Себебі дәл 18 жас та "толған" деп саналады.'}
]},

{n:4, title:'Екі саннан үлкенін табу',
code:`a = int(input("Бірінші сан: "))
b = int(input("Екінші сан: "))

if a > b:
    print(a)
else:
    print(b)`,
ru:`Взяли два числа, сравнили. Если a больше b — печатаем a. А если нет? Значит либо b больше, либо они равны — в обоих случаях нам подходит просто напечатать b, поэтому elif тут даже не нужен, хватает простого else. Логика: "если не первое условие — значит точно второе", без всяких дополнительных проверок.`,
kz:`Екі санды алдық, салыстырдық. Егер a b-дан үлкен болса — a-ны басамыз. Ал болмаса ше? Онда я b үлкен, я екеуі тең — екі жағдайда да жәй b-ны басу дұрыс, сондықтан elif керек емес, жәй else жетеді. Логика қарапайым: "бірінші шарт орындалмаса — екіншісі дұрыс" дегенді білдіреді.`,
qa:[
{q:'a мен b тең болса не шығады?', a:'else бөлігіне түсіп b басылады, бірақ олар тең болғандықтан бәрібір дұрыс.'}
]},

{n:5, title:'Үш саннан ең үлкенін табу',
code:`a = int(input("Бірінші сан: "))
b = int(input("Екінші сан: "))
c = int(input("Үшінші сан: "))

if a > b and a > c:
    print(a)
elif b > a and b > c:
    print(b)
else:
    print(c)`,
ru:`Тут фишка в слове <code>and</code>. Чтобы a реально было самым большим, оно должно быть больше и b, и c — ОБА условия сразу, не одно из. Вот почему <code>and</code>, а не <code>or</code>. Если бы поставили or — было бы достаточно быть больше хотя бы одного числа, и результат был бы неправильный.`,
kz:`Мұндағы бас кейіпкер — <code>and</code> сөзі. a шынымен ең үлкен болу үшін ол b-дан ДА, c-дан ДА үлкен болуы керек — екі шарт бірден, біреуі емес. Сондықтан <code>and</code>, <code>or</code> емес. Егер or қойсақ, тек біреуінен үлкен болу жеткілікті болар еді, бұл қате нәтиже берер еді.`,
qa:[
{q:'Неге and, or емес?', a:'a ең үлкен болу үшін екі санмен де салыстыру керек, бірімен ғана емес.'},
{q:'Үшеуі тең болса не шығады?', a:'Барлық салыстыру жалған, else-ге түсіп c басылады — бәрібір дұрыс, себебі бәрі бірдей.'}
]},

{n:6, title:'Үш саннан ең кішісін табу',
code:`a = int(input("Бірінші сан: "))
b = int(input("Екінші сан: "))
c = int(input("Үшінші сан: "))

if a < b and a < c:
    print(a)
elif b < a and b < c:
    print(b)
else:
    print(c)`,
ru:`Это прям близнец пятого задания, только наоборот — вместо <code>></code> ставим <code>&lt;</code>. Логика один в один: чтобы найти самое маленькое число, оно должно быть меньше обоих остальных сразу.`,
kz:`Бұл 5-тапсырманың егіз бауыры, тек <code>></code> орнына <code>&lt;</code> қойылған. Логика дәл сол: ең кіші санды табу үшін ол қалған екеуінен де кіші болуы керек.`,
qa:[
{q:'5 мен 6 арасында не өзгерді?', a:'Тек > белгісі < болып ауысты, қалғаны бірдей.'}
]},

{n:7, title:'Балл: Өтті / Өтпеді',
code:`ball = int(input("Балл енгізіңіз: "))

if ball >= 50:
    print("Өтті")
else:
    print("Өтпеді")`,
ru:`Совсем базовое задание — балл ввели, сравнили с 50. Если 50 и больше — "прошёл", если меньше — "не прошёл". Один <code>if</code>, один <code>else</code>, ничего лишнего.`,
kz:`Ең қарапайым тапсырма — баллды енгіздік, 50-мен салыстырдық. 50 не одан жоғары болса — "өтті", кем болса — "өтпеді". Бір <code>if</code>, бір <code>else</code>, артық ештеңе жоқ.`,
qa:[
{q:'Балл дәл 50 болса?', a:'>= белгісі бар болғандықтан "Өтті" шығады.'}
]},

{n:8, title:'Балл бойынша баға',
code:`ball = int(input("Балл енгізіңіз: "))

if ball >= 90:
    print("Өте жақсы")
elif ball >= 70:
    print("Жақсы")
elif ball >= 50:
    print("Қанағаттанарлық")
else:
    print("Қанағаттанарлықсыз")`,
ru:`Тут главный секрет — ПОРЯДОК проверки. Начинаем с самого жёсткого условия (90+) и идём вниз. Почему так важно? Питон читает условия сверху вниз и останавливается на первом, которое сработало. Если бы мы начали с ball >= 50, то балл 95 тоже попал бы в "Қанағаттанарлық" уже на первой проверке — и до "Өте жақсы" код бы просто не дошёл. Короче, всегда начинай с самого строгого условия.`,
kz:`Мұндағы бас сыр — тексеру РЕТІ. Ең қатал шарттан (90+) бастап, төмен түсеміз. Неге бұл маңызды? Себебі Python шарттарды жоғарыдан төменге қарай оқиды және бірінші сәйкес келгенінде тоқтайды. Егер ball >= 50-ден бастасақ, 95 балл да бірінші тексерудің өзінде "Қанағаттанарлыққа" түсіп қалар еді, "Өте жақсыға" мүлдем жетпес еді. Қысқасы, әрдайым ең қатал шарттан баста.`,
qa:[
{q:'Реттің маңызы неде?', a:'Ең жоғарыдан бастамасаң, жоғары балл да төменгі санатқа түсіп қалады.'},
{q:'ball=90 болса не шығады?', a:'"Өте жақсы", себебі >=90-ға 90-ның өзі де кіреді.'}
]},

{n:9, title:'Температура санаты',
code:`t = int(input("Температура: "))

if t < 0:
    print("Суық")
elif t <= 20:
    print("Салқын")
else:
    print("Жылы")`,
ru:`Смотри прикол: во второй строке написано просто <code>t <= 20</code>, без нижней границы. А почему не проверяем, что t больше 0? Да потому что до этой строки код УЖЕ проверил, что t не меньше нуля (первый if не сработал). То есть если мы дошли до elif — значит t точно 0 или больше. Экономим себе работу, не дублируем проверки.`,
kz:`Мынаны қара: екінші жолда жәй <code>t <= 20</code> деп жазылған, төменгі шекарасыз. Неге t 0-ден үлкен екенін тексермейміз? Себебі осы жолға дейін код t 0-ден кем емес екенін ТЕКСЕРІП ҮЛГЕРДІ (бірінші if орындалмады). Яғни elif-ке жеткен сәтте, t міндетті түрде 0 не одан жоғары. Артық тексеруден құтылдық.`,
qa:[
{q:'Неге elif-те 0<=t<=20 деп жазбадың?', a:'t<0 шарты жоғарыда сүзілгендіктен, elif-ке тек t>=0 жеткенде ғана түседі.'}
]},

{n:10, title:'Ай нөмірі → мезгіл',
code:`a = int(input("Ай нөмірі: "))

if a == 12 or a == 1 or a == 2:
    print("Қыс")
elif a == 3 or a == 4 or a == 5:
    print("Көктем")
elif a == 6 or a == 7 or a == 8:
    print("Жаз")
elif a == 9 or a == 10 or a == 11:
    print("Күз")

function render(list){
  const el = document.getElementById('list');
  if(list.length === 0){
    el.innerHTML = '<div class="empty">Ештеңе табылмады</div>';
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="card" data-n="${t.n}">
      <div class="card-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="num">${t.n}</div>
        <div class="title">${t.title}</div>
        <div class="chev">⌄</div>
      </div>
      <div class="card-body">
        <div class="section-label" style="margin-top:12px;">Код</div>
        <pre class="code">${hl(t.code)}</pre>

        <div class="langtabs">
          <div class="langtab active" onclick="switchLang(this, ${t.n}, 'ru')">РУ жеңіл тіл</div>
          <div class="langtab" onclick="switchLang(this, ${t.n}, 'kz')">ҚАЗ жеңіл тіл</div>
        </div>
        <div class="explain show" id="ru-${t.n}">${t.ru}</div>
        <div class="explain" id="kz-${t.n}">${t.kz}</div>

        <div class="section-label">Мұғалім қоюы мүмкін сұрақтар</div>
        ${t.qa.map(qa => `
          <div class="qa">
            <div class="q">${qa.q}</div>
            <div class="a">${qa.a}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function switchLang(btn, n, lang){
  const parent = btn.parentElement;
  parent.querySelectorAll('.langtab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ru-'+n).classList.toggle('show', lang==='ru');
  document.getElementById('kz-'+n).classList.toggle('show', lang==='kz');
}

let currentSearch = '';

function applyFilters(){
  let list = tasks;
  if(currentSearch.trim() !== ''){
    const q = currentSearch.trim().toLowerCase();
    list = list.filter(t =>
      String(t.n) === q ||
      t.title.toLowerCase().includes(q) ||
      t.code.toLowerCase().includes(q)
    );
  }
  render(list);
}

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  applyFilters();
});

render(tasks);
</script>
